name: Backlog Automation

# Reference implementation: https://github.com/calan-co/doc-vader/blob/main/.github/workflows/backlog-automation.yml
#
# To sync updates from the reference, compare this file's content and re-copy
# any changes to the reusable sub-workflow `uses:` refs or trigger conditions.
#
# Prerequisites:
#   1. Create .doc-vader/backlog-consumer.json (see https://github.com/calan-co/doc-vader/tree/main/docs).
#   2. Configure any required secrets per .github/SECRETS.md. This workflow can
#      optionally use PACKAGES_READ_TOKEN when the default GITHUB_TOKEN cannot
#      read packages for calan-co/doc-vader (for example, outside the calan-co
#      org); if needed, create PACKAGES_READ_TOKEN with package read access
#      (for example, a classic PAT with read:packages).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview eligible updates without writing changes'
        required: false
        default: false
        type: boolean
  pull_request:
    types: [opened, edited, reopened, synchronize, closed]
    branches:
      - main
      - staging
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: write
  packages: read
  pull-requests: read

jobs:
  ingest-pull-request:
    name: Ingest Pull Request Event
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.BACKLOG_AUTOMATION_ENABLED == 'true'
    uses: calan-co/doc-vader/.github/workflows/backlog-ingest-pull-request.yml@v1
    with:
      consumer-config: .doc-vader/backlog-consumer.json
      doc-vader-version: next
    secrets:
      packages-read-token: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

  ingest-workflow-run:
    name: Ingest Workflow Run Event
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.BACKLOG_AUTOMATION_ENABLED == 'true'
    uses: calan-co/doc-vader/.github/workflows/backlog-ingest-workflow-run.yml@v1
    with:
      consumer-config: .doc-vader/backlog-consumer.json
      doc-vader-version: next
    secrets:
      packages-read-token: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

  sweep:
    name: Sweep Eligible Work Items
    if: github.event_name == 'workflow_dispatch' && vars.BACKLOG_AUTOMATION_ENABLED == 'true'
    uses: calan-co/doc-vader/.github/workflows/backlog-sweep.yml@v1
    with:
      dry-run: ${{ inputs.dry_run || false }}
      consumer-config: .doc-vader/backlog-consumer.json
      backlog-dir: backlog
      doc-vader-version: next
    secrets:
      packages-read-token: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
