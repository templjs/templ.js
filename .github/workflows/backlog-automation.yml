name: Backlog Automation
on:
  pull_request:
    types: [closed]
    branches: [staging, main]

jobs:
  ingest:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ingest Changes
        uses: calan-co/backlog-automation@v1
        with:
          app-id: ${{ secrets.BACKLOG_APP_ID }}
          app-private-key: ${{ secrets.BACKLOG_APP_PRIVATE_KEY }}
          dry_run: true
