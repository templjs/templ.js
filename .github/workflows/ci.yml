name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: calan-co/cicd-shared-pipeline/.github/workflows/reusable-node-package-ci.yml@v1
    with:
      node-version: '24'
      install-command: pnpm install --frozen-lockfile
      lint-command: pnpm run ci:lint
      typecheck-command: pnpm run ci:type-check
      backlog-command: pnpm run ci:frontmatter
      docs-command: pnpm run ci:docs-api
      test-command: pnpm run ci:test
      build-command: pnpm run ci:build
      test-matrix-node-versions: '["22", "24"]'
      test-matrix-os: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      enable-changeset-check: false
    secrets: inherit

  require-changeset:
    name: Require Changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          node-version: '24'

      - name: Enforce Changeset for released artifacts
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pnpm run ci:changeset-guard -- \
            --base="$PR_BASE_SHA" \
            --head="$PR_HEAD_SHA" \
            --head-ref="$HEAD_REF" \
            --pr-title="$PR_TITLE"

  require-release-note:
    name: Require Release Metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup workspace toolchain
        uses: ./.github/actions/setup-workspace
        with:
          node-version: '24'

      - name: Enforce release metadata for released artifacts
        run: pnpm run ci:release-note-guard
