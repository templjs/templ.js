name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - release/**

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  version:
    name: Version and Publish
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.parsed.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-workspace
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Build all packages
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Parse published version
        id: parsed
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          VERSION=$(echo "$PUBLISHED_PACKAGES" | jq -r '.[0].version')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Failed to parse version from publishedPackages"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: steps.changesets.outputs.published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.parsed.outputs.version }}
          name: Release v${{ steps.parsed.outputs.version }}
          body: |
            Release v${{ steps.parsed.outputs.version }}

            See CHANGELOG.md for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-vscode-extension:
    name: Publish VS Code Extension
    runs-on: ubuntu-latest
    needs: version
    if: github.event_name == 'push' && contains(github.ref, 'release/') && needs.version.outputs.published == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup workspace toolchain
        uses: ./.github/actions/setup-workspace

      - name: Build VS Code extension
        run: pnpm --filter vscode-templjs build

      - name: Package VS Code extension
        run: |
          cd src/extensions/vscode
          npx vsce package

      - name: Publish to VS Code Marketplace
        run: |
          cd src/extensions/vscode
          npx vsce publish -p ${{ secrets.VSCODE_PUBLISHER_TOKEN }}
        env:
          VSCE_PAT: ${{ secrets.VSCODE_PUBLISHER_TOKEN }}

      - name: Publish to Open VSX Registry
        run: |
          cd src/extensions/vscode
          npx ovsx publish -p ${{ secrets.OPEN_VSX_TOKEN }}
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
