# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'en-US'
reviews:
  profile: 'assertive'
  auto_review:
    enabled: true
    drafts: false
  # When enabled, CodeRabbit can auto-approve after its comments are resolved
  # and pre-merge checks are passing.
  request_changes_workflow: true
  review_status: true
  review_details: true
chat:
  auto_reply: true
